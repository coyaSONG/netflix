version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Seoul
    open-pull-requests-limit: 2
    ignore:
      # Prisma 7 does not support MongoDB yet. Keep receiving compatible v6 updates.
      - dependency-name: "@prisma/client"
        versions: [">=7.0.0"]
      - dependency-name: prisma
        versions: [">=7.0.0"]
    commit-message:
      prefix: chore
      include: scope
